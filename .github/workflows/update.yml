name: update-feed

on:
  schedule:
    # 3 раза в день (UTC). Ночной прогон (03:00) дополнительно пере-скрейпит
    # карточки: РРЦ и характеристики живут только там, в листинге их нет.
    - cron: "0 3,9,15 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Пере-скрейп всех карточек (1/0)"
        default: "0"

concurrency:
  group: kmt-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Определить, нужен ли пере-скрейп карточек
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "refresh=${{ github.event.inputs.refresh }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" -lt 6 ]; then
            echo "refresh=1" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Запуск парсера
        env:
          KMT_EMAIL: ${{ secrets.KMT_EMAIL }}
          KMT_PASSWORD: ${{ secrets.KMT_PASSWORD }}
          REFRESH: ${{ steps.mode.outputs.refresh }}
        run: python run.py

      - name: Коммит результатов
        run: |
          git config user.name "kmt-bot"
          git config user.email "actions@github.com"
          # Фид и кеши — генерируемые артефакты: их нельзя СЛИВАТЬ с чужой
          # версией (построчный merge XML склеивает два фида в гибрид).
          # Поэтому переносим свои файлы поверх свежего origin как есть.
          for i in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add docs/feed.xml catalog.json meta.json their_ids.json their_codes.json
            git diff --cached --quiet && echo "нет изменений" && exit 0
            git commit -m "feed update $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push origin main && exit 0
            echo "push отклонён, повтор $i"
          done
          exit 1
